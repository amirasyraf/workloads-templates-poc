[tools]
actionlint = "1.7.12"
jq = "1.8.1"
terraform = "1.14.8"

[tasks.check]
description = "Validate workflows and Terraform"
run = [
  "actionlint .github/workflows/*.yml",
  "jq empty catalog/platforms.json release-please-config.json .release-please-manifest.json",
  "terraform -chdir=aws fmt -check",
  "terraform -chdir=aws init -backend=false -input=false",
  "terraform -chdir=aws validate",
]
